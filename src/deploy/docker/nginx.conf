server {
  listen 80;
  root /usr/share/nginx/html;
  # Docker assigns a new address whenever a service container is recreated.
  # Resolve service names per request instead of retaining the address that
  # Nginx discovered when this container first started.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $runtime_service http://runtime-service:8081;
  set $control_plane http://control-plane:8080;
  location = /api/v1/runs/stream {
    proxy_pass $runtime_service$request_uri;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 35m;
    add_header X-Accel-Buffering no;
  }
  location /api/v1/runs { proxy_pass $runtime_service$request_uri; proxy_set_header X-Tenant-Id $http_x_tenant_id; }
  location /api/v1/memory { proxy_pass $runtime_service$request_uri; proxy_set_header X-Tenant-Id $http_x_tenant_id; }
  location /api/v1/observability { proxy_pass $runtime_service$request_uri; proxy_set_header X-Tenant-Id $http_x_tenant_id; }
  location /widget/ { proxy_pass $control_plane$request_uri; }
  location /api/ { proxy_pass $control_plane$request_uri; proxy_set_header X-Tenant-Id $http_x_tenant_id; }
  location / { try_files $uri /index.html; }
}
