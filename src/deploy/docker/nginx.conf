server {
  listen 80;
  root /usr/share/nginx/html;
  location = /api/v1/runs/stream {
    proxy_pass http://runtime-service:8081;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 35m;
    add_header X-Accel-Buffering no;
  }
  location /api/v1/runs { proxy_pass http://runtime-service:8081; proxy_set_header X-Tenant-Id $http_x_tenant_id; }
  location /api/v1/memory { proxy_pass http://runtime-service:8081; proxy_set_header X-Tenant-Id $http_x_tenant_id; }
  location /api/ { proxy_pass http://control-plane:8080; proxy_set_header X-Tenant-Id $http_x_tenant_id; }
  location / { try_files $uri /index.html; }
}
