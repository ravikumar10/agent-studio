spring:
  application.name: agent-studio-runtime-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agent_studio}
    username: ${DATABASE_USER:agent_studio}
    password: ${DATABASE_PASSWORD:agent_studio}
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
runtime:
  docker-host: ${RUNTIME_DOCKER_HOST:tcp://docker-api-proxy:2375}
  docker-worker-image: ${RUNTIME_DOCKER_WORKER_IMAGE:agent-studio/runtime-worker:local}
  docker-network: ${RUNTIME_DOCKER_NETWORK:agent-studio_default}
  worker-token: ${RUNTIME_WORKER_TOKEN:local-worker-token-change-me}
  tool-cache:
    ttl-seconds: ${RUNTIME_TOOL_CACHE_TTL_SECONDS:300}
server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
agent-studio:
  secrets:
    encryption-key: ${AGENT_STUDIO_ENCRYPTION_KEY:local-development-encryption-key-change-me}
